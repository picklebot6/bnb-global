name: Run BNB Workflow - Process Sales Orders
run-name: Process Sales Orders

on:
  workflow_dispatch:
    inputs:
      user:
        description: 'User 선택하세요'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: bnb-process-sales-orders
  cancel-in-progress: false

jobs:
  process-sales-orders:
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    env:
      CI: 'true'

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Check TypeScript
        run: npm run typecheck

      - name: Run sales order workflow
        env:
          BNB_BASE_URL: ${{ secrets.BNB_BASE_URL }}
          BNB_USERNAME: ${{ secrets.BNB_USERNAME }}
          BNB_PASSWORD: ${{ secrets.BNB_PASSWORD }}
          SALES_ORDER_USERS: ${{ inputs.user }}
        run: |
          for name in BNB_BASE_URL BNB_USERNAME BNB_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub Actions configuration: $name"
              exit 1
            fi
          done

          echo "::add-mask::$BNB_BASE_URL"
          echo "::add-mask::$BNB_USERNAME"
          echo "::add-mask::$BNB_PASSWORD"

          npm run pso

      - name: Convert recordings to MP4
        if: always()
        shell: bash
        run: |
          shopt -s globstar nullglob

          videos=(test-results/**/*.webm)

          if [ "${#videos[@]}" -eq 0 ]; then
            echo "No recordings were produced."
            exit 0
          fi

          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi

          for video in "${videos[@]}"; do
            ffmpeg -hide_banner -loglevel error -y \
              -i "$video" \
              -c:v libx264 \
              -preset veryfast \
              -crf 23 \
              -vf "pad=ceil(iw/2)*2:ceil(ih/2)*2" \
              -pix_fmt yuv420p \
              -an \
              -movflags +faststart \
              "${video%.webm}.mp4"
          done

      - name: Upload MP4 workflow videos
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: process-sales-orders-videos-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/**/*.mp4
          if-no-files-found: warn
          retention-days: 7
