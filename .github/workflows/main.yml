name: Run BNB workflow

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bnb-workflow
  cancel-in-progress: false

jobs:
  run-main:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: 'true'
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Check TypeScript
        run: npm run typecheck

      - name: Run main workflow
        env:
          BNB_BASE_URL: ${{ secrets.BNB_BASE_URL || vars.BNB_BASE_URL }}
          BNB_USERNAME: ${{ secrets.BNB_USERNAME }}
          BNB_PASSWORD: ${{ secrets.BNB_PASSWORD }}
        run: |
          for name in BNB_BASE_URL BNB_USERNAME BNB_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub Actions configuration: $name"
              exit 1
            fi
          done
          echo "::add-mask::$BNB_BASE_URL"
          npm run main

      - name: Upload workflow videos
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: workflow-videos-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/**/*.webm
          if-no-files-found: warn
          retention-days: 7
