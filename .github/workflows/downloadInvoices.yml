name: Run BNB Workflow - Download Invoices
run-name: Download Invoices

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bnb-workflow
  cancel-in-progress: false

jobs:
  download-invoices:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      CI: 'true'

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Check TypeScript
        run: npm run typecheck

      - name: Run invoice workflow
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_CLIENT_ID: ${{ secrets.SMTP_CLIENT_ID }}
          SMTP_CLIENT_SECRET: ${{ secrets.SMTP_CLIENT_SECRET }}
          SMTP_REFRESH_TOKEN: ${{ secrets.SMTP_REFRESH_TOKEN }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
        run: |
          for name in BNB_BASE_URL BNB_USERNAME BNB_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub Actions configuration: $name"
              exit 1
            fi
          done

          echo "::add-mask::$BNB_BASE_URL"

          npm run di

      - name: Convert recordings to MP4
        if: always()
        shell: bash
        run: |
          shopt -s globstar nullglob

          videos=(test-results/**/*.webm)

          if [ "${#videos[@]}" -eq 0 ]; then
            echo "No recordings were produced."
            exit 0
          fi

          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi

          for video in "${videos[@]}"; do
            ffmpeg -hide_banner -loglevel error -y \
              -i "$video" \
              -c:v libx264 \
              -preset fast \
              -crf 23 \
              -vf "pad=ceil(iw/2)*2:ceil(ih/2)*2" \
              -pix_fmt yuv420p \
              -an \
              -movflags +faststart \
              "${video%.webm}.mp4"
          done

      - name: Upload invoice PDFs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: invoice-pdfs-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/pdf/*.pdf
          if-no-files-found: warn
          retention-days: 7

      - name: Upload MP4 workflow videos
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: workflow-videos-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/**/*.mp4
          if-no-files-found: warn
          retention-days: 7